[package]
name = "aosu-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Transport-agnostic core for an Aosu/H1L desktop client: device model, Transport trait, mock/local/cloud transport skeletons, diagnostics."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tuya-lan-protocol = { path = "../tuya-lan-protocol" }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
